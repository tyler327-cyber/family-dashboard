<script>
const $ = s => document.querySelector(s);
const money = n => n==null ? "—" : (n<0?"-$":"$") + Math.abs(n).toLocaleString("en-US",{maximumFractionDigits:0});
const P = DATA.personal, V = DATA.buckets.variable, Fx = DATA.buckets.fixed;

/* ---- shared totals ---- */
const cfNet = P.cashflow.monthIn - P.cashflow.monthOut;
const incomeTotal = P.income.month;

/* ---- SUMMARY ---- */
const hr = new Date().getHours();
$("#greet").textContent = hr<12?"Good morning":hr<18?"Good afternoon":"Good evening";
$("#wandaMsg").textContent = DATA.wandaMessage||"";
const diningSynced = V.dining.spentWeek != null;
const variableKeys = ["dining", "groceries", "shopping", "gas", "other"];
const weekSynced = variableKeys.every(k => V[k].spentWeek != null);
const dLeft = diningSynced ? V.dining.budgetWeek - V.dining.spentWeek : null;
const weekVariableSpent = weekSynced ? variableKeys.reduce((sum,k)=>sum + V[k].spentWeek, 0) : null;
const weekVariableLeft = weekSynced ? DATA.budgetPlan.overallWeeklyTarget - weekVariableSpent : null;
const resetDay = DATA.budgetPlan.weekStarts || "Sunday";
const diningDisciplineNeeded = diningSynced && V.dining.spentWeek >= 40;
const foodState = !diningSynced ? "yellow" : dLeft < 0 ? "red" : (dLeft <= 25 || diningDisciplineNeeded) ? "yellow" : "green";
const foodAnswer = !diningSynced ? "CHECK" : foodState === "green" ? "YES" : foodState === "yellow" ? "CAREFUL" : "NO";
const foodReason = !diningSynced
  ? "Budget reset, but account activity has not updated. Keep spending conservative until synced."
  : foodState === "red"
    ? "Dining is over target. Choose groceries or home food until reset."
    : diningDisciplineNeeded
      ? "Taco Stand used about one-third of dining. Slow down and favor home food."
      : foodState === "yellow"
        ? "Small/simple food only — dining is almost used up."
        : "Okay if it stays inside the weekly cap.";
const foodEl = $("#foodSignal");
foodEl.classList.toggle("green", foodState === "green");
foodEl.classList.toggle("yellow", foodState === "yellow");
foodEl.innerHTML = `
  <div>
    <div class="question">Can we eat out?</div>
    <div class="answer">${foodAnswer}</div>
    <div class="reason">${foodReason}</div>
  </div>
  <div class="numbers">
    <div class="num"><div class="nlabel">Dining</div><div class="nval">${money(V.dining.spentWeek)} / ${money(V.dining.budgetWeek)}</div></div>
    <div class="num"><div class="nlabel">Week cap</div><div class="nval">${weekSynced ? money(weekVariableSpent) : "Sync needed"} / ${money(DATA.budgetPlan.overallWeeklyTarget)}</div></div>
    <div class="num"><div class="nlabel">Cap left</div><div class="nval ${weekSynced && weekVariableLeft>=0?'good':weekSynced?'bad':'warn'}">${weekSynced ? money(weekVariableLeft) : "—"}</div></div>
    <div class="next">Next reset: ${resetDay}</div>
  </div>`;
const savingsTotal = DATA.savings.houseFund + DATA.savings.sofi + DATA.savings.robinhood + DATA.savings.ira;
$("#sumGrid").innerHTML =
  tile("Week cap left", weekSynced?money(weekVariableLeft):"Sync needed", weekSynced?(weekVariableLeft>=0?"good":"bad"):"warn", weekSynced ? "spent "+money(weekVariableSpent)+" / "+money(DATA.budgetPlan.overallWeeklyTarget) : "account updates needed") +
  tile("Dining left · week", diningSynced?money(dLeft):"Sync needed", diningSynced?(dLeft>=0?"good":"bad"):"warn", "spent "+money(V.dining.spentWeek)+" / "+money(V.dining.budgetWeek)) +
  tile("Amex balance", money(DATA.budgetPlan.amexTotalBalance), "warn", "pending "+money(DATA.budgetPlan.amexPending));
function tile(lbl,big,cls,sub){ return `<div class="sumtile"><div class="lbl">${lbl}</div><div class="big ${cls}">${big}</div><div class="sub">${sub}</div></div>`; }
const A = DATA.budgetPlan.accountBalances || {};
const accountRows = [
  ["Chase 3222", "Main Joint account", A.personal3222],
  ["Chase 1969", "AZ Ramar", A.azRamar1969],
  ["Chase 3235", "Easy Launch Services", A.easyLaunch3235],
  ["Chase 3602", `CA Palmdale · +${money((A.palmdaleExpectedBooking||0) - (A.palmdaleCleanerDue||0))} planned`, A.palmdale3602],
  ["Chase 8072", "AZ Pegasus", A.azPegasus8072]
];
$("#accountBalances").className = "acctgrid";
$("#accountBalances").innerHTML = accountRows.map(([name,purpose,balance]) =>
  `<div class="acctrow"><div class="acctname">${name}<span class="acctpurpose">${purpose}</span></div><div class="acctbal ${balance==null?'warn':balance<500?'warn':'good'}">${money(balance)}</div></div>`
).join("");

/* ---- PERSONAL ---- */
// Top-left: Income
$("#colIncome").innerHTML =
  `<div class="ch">Income</div>` +
  `<div class="hero good">${money(P.income.month)}</div><div class="herosub">this month</div>` +
  `<div class="line"><span class="lname">This week</span><span class="lamt good">${money(P.income.week)}</span></div>` +
  P.income.items.map(i=>`<div class="line"><span class="lname" style="font-size:2.1vh;color:#c98b8b">${i.label}</span><span class="lamt good" style="font-size:2.1vh">${money(i.monthly)}</span></div>`).join("");

// Top-right: Cash flow
const cfWeek = P.cashflow.weekIn - P.cashflow.weekOut;
const cfMonth = P.cashflow.monthIn - P.cashflow.monthOut;
$("#colCashflow").innerHTML =
  `<div class="ch">Cash flow</div>` +
  `<div class="hero ${cfMonth>=0?'good':'bad'}">${(cfMonth>=0?"+":"")+money(cfMonth)}</div><div class="herosub">this month · in − out</div>` +
  `<div class="line"><span class="lname">Week net</span><span class="lamt ${cfWeek>=0?'good':'bad'}">${(cfWeek>=0?'+':'')+money(cfWeek)}</span></div>` +
  `<div class="line"><span class="lname in" style="font-size:2.1vh">In · month</span><span class="lamt in" style="font-size:2.1vh">${money(P.cashflow.monthIn)}</span></div>` +
  `<div class="line"><span class="lname out" style="font-size:2.1vh">Out · month</span><span class="lamt out" style="font-size:2.1vh">${money(P.cashflow.monthOut)}</span></div>`;

// Bottom: expenses split week / month
function expRows(period){ // period = 'Week' or 'Month'
  const sp = period==='Week'?'spentWeek':'spentMonth', bd = period==='Week'?'budgetWeek':'budgetMonth';
  let html = catRow("Fixed", Fx[sp], Fx[period==='Week'?'weekly':'monthly'], "#8b6a3a");
  const order = [["Dining","dining"],["Groceries","groceries"],["Shopping","shopping"],["Gas","gas"],["Other","other"]];
  for(const [name,key] of order){ const c=V[key];
    html += catRow(name, c[sp], c[bd], null, period==='Month'); }
  return html;
}
function catRow(name, spent, budget, fixedCol, noCap){
  if(spent==null){
    return `<div class="mini"><div class="minirow"><span class="mininame">${name}</span><span class="miniamt warn">Awaiting sync · target ${money(budget)}</span></div>${bar(0,budget,"#5a2428")}</div>`;
  }
  const p = budget?Math.min(100,spent/budget*100):0;
  const col = fixedCol || (noCap?"#c98b8b":p<70?"#3fb950":p<100?"#d29922":"#f85149");
  const right = noCap?money(spent):money(spent)+" / "+money(budget);
  return `<div class="mini"><div class="minirow"><span class="mininame">${name}</span><span class="miniamt">${right}</span></div>${bar(spent,budget,col)}</div>`;
}
$("#expWeek").innerHTML = expRows('Week');
$("#expMonth").innerHTML = expRows('Month');

function bar(spent,target,col){ const p=target?Math.min(100,spent/target*100):0;
  return `<div class="minibar"><div style="width:${p}%;background:${col}"></div></div>`; }

/* ---- BUSINESS ---- */
function bizCard(g){ const net=g.month.income-g.month.expenses;
  return `<div class="bizcard">
    <div class="bizname">${g.name}</div>
    <div class="biznet ${net>=0?'good':'bad'}">${net>=0?'+':''}${money(net)}</div>
    <div class="bizIO"><div class="col2"><div class="k">Income</div><div class="in">${money(g.month.income)}</div></div>
      <div class="col2"><div class="k">Expenses</div><div class="out">${money(g.month.expenses)}</div></div></div>
    <div class="bizItems"><div class="line"><span class="lname">Net this month</span><span class="lamt ${net>=0?'good':'bad'}">${net>=0?'+':''}${money(net)}</span></div></div>
  </div>`;
}
$("#bizGrid").innerHTML = bizCard(DATA.business.easylaunch) + bizCard(DATA.business.azramar);

/* ---- SAVINGS ---- */
const S = DATA.savings;
$("#saveGrid").innerHTML =
  saveCard("House Fund", S.houseFund, "down payment", "good") +
  saveCard("Robinhood", S.robinhood, "investments", "") +
  saveCard("Self-Directed IRA", S.ira, "retirement", "") +
  saveCard("SoFi Savings", S.sofi, "emergency fund", "");
function saveCard(name,val,note,cls){ return `<div class="savecard"><div class="sname">${name}</div><div class="sval ${cls}">${money(val)}</div><div class="snote">${note}</div></div>`; }
$("#saveTotal").innerHTML = `Total saved &amp; invested: <b>${money(savingsTotal)}</b>`;

/* ---- TASKS: grouped day/week/month with % ---- */
const allTasks = [...(DATA.tasks.day||[]), ...(DATA.tasks.week||[]), ...(DATA.tasks.month||[])];
$("#taskCount").textContent = "· " + allTasks.filter(t=>!t.done).length + " open";
function taskGroup(title, list){
  if(!list || !list.length) return `<div class="tgroup"><div class="tgtitle">${title}<span class="tgpct">—</span></div><div class="tgempty">nothing yet</div></div>`;
  const done = list.filter(t=>t.done).length;
  const pct = Math.round(done/list.length*100);
  return `<div class="tgroup">
    <div class="tgtitle">${title}<span class="tgpct ${pct===100?'good':''}">${pct}%</span></div>
    <div class="tgbar"><div style="width:${pct}%"></div></div>
    <ul class="tgitems">${list.map(t=>`<li class="${t.done?'done':''}"><span class="tbox">${t.done?'✓':''}</span>${t.text}</li>`).join("")}</ul>
  </div>`;
}
$("#taskGroups").innerHTML =
  taskGroup("Today", DATA.tasks.day) +
  taskGroup("This Week", DATA.tasks.week) +
  taskGroup("This Month", DATA.tasks.month);

/* ---- CALENDAR ---- */
const now=new Date();
$("#calTitle").textContent = now.toLocaleDateString("en-US",{month:"long",year:"numeric"});
const y=now.getFullYear(), m=now.getMonth();
const fd=new Date(y,m,1).getDay(), di=new Date(y,m+1,0).getDate();
const ev=new Set(DATA.events.map(e=>e.date));
let g=["S","M","T","W","T","F","S"].map(d=>`<div class="dow">${d}</div>`).join("");
for(let i=0;i<fd;i++) g+=`<div></div>`;
for(let d=1;d<=di;d++){ const iso=`${y}-${String(m+1).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
  g+=`<div class="day ${d===now.getDate()?'today':''} ${ev.has(iso)?'hasEvent':''}">${d}</div>`; }
$("#calGrid").innerHTML=g;
$("#eventRows").innerHTML=DATA.events.map(e=>{ const dt=new Date(e.date+"T00:00");
  const w=dt.toLocaleDateString("en-US",{weekday:"short",month:"short",day:"numeric"})+(e.time?" · "+e.time:"");
  return `<li><div class="when">${w}</div><div class="what">${e.title}</div></li>`; }).join("")||"<li><div class='what'>No events</div></li>";
/* week tasks on calendar */
const wkTasks = DATA.tasks.week||[];
$("#calTaskRows").innerHTML = wkTasks.length
  ? wkTasks.map(t=>`<li class="${t.done?'done':''}" style="list-style:none;display:flex;align-items:center;gap:1vw;font-size:2.4vh;padding:.7vh 0"><span class="tbox">${t.done?'✓':''}</span>${t.text}</li>`).join("")
  : "<li style='list-style:none;color:#7a4a4d;font-size:2.2vh'>No tasks this week</li>";

$("#upd").textContent = DATA.updated;

/* ---- clock + cycling ---- */
function tick(){ const t=new Date().toLocaleTimeString("en-US",{hour:"numeric",minute:"2-digit"});
  document.querySelectorAll(".clock").forEach(c=>c.textContent=t); }
tick(); setInterval(tick,15000);
const screens=[$("#s0"),$("#s1"),$("#s2"),$("#s3"),$("#s4"),$("#s5")], dots=document.querySelectorAll(".dots span");
let cur=0;
function show(i){ cur=(i+screens.length)%screens.length; screens.forEach((s,j)=>s.classList.toggle("active",j===cur)); dots.forEach((d,j)=>d.classList.toggle("on",j===cur)); }
show(0);
let auto=null, idle=null;
function startAuto(){ if(!auto) auto=setInterval(()=>show(cur+1),18000); }
function act(g){ clearInterval(auto); auto=null; if(typeof g==="number") show(g); clearTimeout(idle); idle=setTimeout(startAuto,600000); }
startAuto();
dots.forEach((d,i)=>d.addEventListener("click",()=>act(i)));
document.body.addEventListener("click",e=>{ if(e.target.closest(".dots"))return; act(cur+(e.clientX>window.innerWidth/2?1:-1)); });
let x0=null;
document.body.addEventListener("touchstart",e=>{x0=e.changedTouches[0].clientX;},{passive:true});
document.body.addEventListener("touchend",e=>{ if(x0===null)return; const dx=e.changedTouches[0].clientX-x0; if(Math.abs(dx)>50) act(cur+(dx<0?1:-1)); x0=null; },{passive:true});
</script>
</body>
</html>
