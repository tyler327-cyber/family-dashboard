<style>

  .cfcard.cfbad { box-shadow:0 0 30px rgba(248,81,73,.14) inset; }

  .bkt .bval { font-size:2.8vh; font-variant-numeric:tabular-nums; font-weight:600; }
  .bkt .bar { height:2vh; margin-top:1.2vh; }
  .bkt.head { background:transparent; border:none; padding:.5vh 0; }
  .bkt.head .bname { font-size:2.3vh; color:#d99a9a; text-transform:uppercase; letter-spacing:.08em; }
  .recent-sm { margin-top:1.5vh; padding:1.6vh 2.4vh; flex:0 0 auto; }

  .pcard .io .in { color:#3fb950; } .pcard .io .out { color:#f85149; }

  .bar { height:2.6vh; background:#4a1a1f; border-radius:99px; overflow:hidden; margin-top:1.4vh; }

  .recent { margin-top:2.5vh; background:#2a0d10; border:1px solid #4a1a1f; border-radius:18px; padding:2.4vh 2.8vh; flex:1; min-height:0; overflow:hidden; }

  .recent ul { list-style:none; }

  .recent .rleft { color:#fbe9e9; }
  .recent .rleft .rdate { color:#d99a9a; font-size:2.1vh; margin-right:1vw; }
  .recent .rnote { color:#d99a9a; font-size:2.1vh; margin-left:1vw; }
  .recent .ramt { font-variant-numeric:tabular-nums; font-weight:600; }

  .tasklist { font-size:var(--taskSize, 4.2vh); line-height:1.9; }
  .tasklist li { list-style:none; display:flex; align-items:center; gap:1.5vw; }
  .box { width:3.6vh; height:3.6vh; border:.35vh solid #5a2428; border-radius:.9vh; flex:0 0 auto;
    display:flex; align-items:center; justify-content:center; font-size:2.6vh; }
  .done { color:#7a4a4d; text-decoration:line-through; }

  .dots { position:absolute; bottom:2.5vh; left:0; right:0; display:flex; justify-content:center; gap:1.4vh; z-index:10; }

  .dots span.on { background:#fbe9e9; background-clip:content-box; }

</head>
<body>
<img class="wanda" src="wanda.png" alt="" onerror="this.style.display='none'">

<!-- SCREEN 0: WANDA SUMMARY -->
<section class="screen" id="s0">
  <header><h1 id="greet">Good morning</h1><div class="clock"></div></header>
  <div class="summary">
    <div class="wcard">
      <img class="wportrait" src="wanda.png" alt="Wanda" onerror="this.style.display='none'">
      <div class="wmsg" id="wandaMsg"></div>
    </div>
    <div class="goals" id="goalRows"></div>
    <div class="headline" id="headline"></div>
  </div>
</section>


<!-- SCREEN 1: PERSONAL -->
<section class="screen" id="s1">
  <header><h1>Personal <span class="tag">· Money</span></h1><div class="clock"></div></header>
  <div class="cashflow" id="cashflowRow"></div>
  <div class="buckets" id="bucketRows"></div>
  <div class="recent recent-sm"><ul id="recentPersonalRows"></ul></div>
</section>

<!-- SCREEN 2: EASY LAUNCH -->
<section class="screen" id="s2">
  <header><h1>Business <span class="tag">· Income &amp; Expenses</span></h1><div class="clock"></div></header>
  <div class="bizgroups" id="bizRows"></div>
</section>

<!-- SCREEN: SAVINGS / INVESTMENTS -->
<section class="screen" id="sSave">
  <header><h1>Savings <span class="tag">· Toward the goal</span></h1><div class="clock"></div></header>
  <div class="periods" id="savingsRows"></div>
  <div class="headline" id="savingsNote"></div>
</section>

<!-- SCREEN 3: TASKS -->
<section class="screen" id="s3">
  <header><h1>Today's Tasks</h1><div class="clock"></div></header>
  <ul class="tasklist" id="taskRows"></ul>
</section>

<!-- SCREEN 4: CALENDAR -->
<section class="screen" id="s4">
  <header><h1 id="calTitle">Calendar</h1><div class="clock"></div></header>
  <div class="cal">
    <div><div class="grid" id="calGrid"></div></div>
    <div><ul class="events" id="eventRows"></ul></div>
  </div>
</section>

<div class="dots"><span></span><span></span><span></span><span></span><span></span><span></span></div>
<div class="updated">Updated <span id="upd"></span></div>

<script>
const $ = s => document.querySelector(s);
const money = n => (n<0?"-$":"$") + Math.abs(n).toLocaleString("en-US",{maximumFractionDigits:0});

function periodCards(world, budgets){
  return ["day","week","month"].map(p => {
    const d = world[p], net = d.income - d.expenses;
    const label = p==="day"?"Today":p==="week"?"This Week":"This Month";
    let barHtml = "";
    if (budgets){
      const b = budgets[p], pct = Math.min(100, d.expenses/b*100);
      const col = pct<70?"#3fb950":pct<100?"#d29922":"#f85149";
      barHtml = `<div class="io" style="margin-top:1.4vh">${money(d.expenses)} of ${money(b)} budget</div>
        <div class="bar" style="margin-top:.8vh"><div style="width:${pct}%;background:${col}"></div></div>`;
    }
    return `<div class="pcard">
      <div class="plabel">${label}</div>
      <div class="net ${net>=0?"good":"bad"}">${money(net)}</div>
      <div class="io"><span class="in">+${money(d.income)}</span> &nbsp;·&nbsp; <span class="out">${money(d.expenses)}</span></div>
      ${barHtml}
    </div>`;
  }).join("");
}

/* Personal screen — three buckets */
function bucketBar(spent, target, opts){
  opts = opts || {};
  const pct = target ? Math.min(100, spent/target*100) : 0;
  const col = opts.noCap ? "#d99a9a" : pct<70?"#3fb950":pct<100?"#d29922":"#f85149";
  const right = opts.noCap ? money(spent) + " · ~" + money(target) + "/mo typical"
                           : money(spent) + " of " + money(target);
  return `<div class="bkt">
    <div class="btop"><div class="bname">${opts.name}<span class="bsub">${opts.per||""}</span></div>
      <div class="bval" style="color:${opts.noCap?'#fbe9e9':(target-spent>=0?'#3fb950':'#f85149')}">${right}</div></div>
    <div class="bar"><div style="width:${pct}%;background:${col};height:100%;border-radius:99px"></div></div>
  </div>`;
}
const V = DATA.buckets.variable, Fx = DATA.buckets.fixed;
$("#bucketRows").innerHTML =
  `<div class="bkt head"><div class="bname">Must-pay (fixed) · monthly</div></div>` +
  `<div class="bkt"><div class="btop"><div class="bname">Fixed bills</div>
     <div class="bval">${money(Fx.spent)} of ${money(Fx.monthly)}</div></div>
     <div class="bar"><div style="width:${Math.min(100,Fx.spent/Fx.monthly*100)}%;background:#8b6a3a;height:100%;border-radius:99px"></div></div></div>` +
  `<div class="bkt head"><div class="bname">Can-control (variable)</div></div>` +
  bucketBar(V.dining.spentWeek, V.dining.budgetWeek, {name:"Dining / Takeout", per:"this week"}) +
  bucketBar(V.groceries.spentWeek, V.groceries.budgetWeek, {name:"Groceries", per:"this week"}) +
  bucketBar(V.shopping.spentMonth, V.shopping.budgetMonth, {name:"Shopping", per:"this month"}) +
  bucketBar(V.gas.spentMonth, V.gas.typicalMonth, {name:"Gas", per:"this month", noCap:true}) +
  bucketBar(V.other.spentMonth, V.other.budgetMonth, {name:"Other", per:"this month"});
/* Personal cash flow headline */
const cf = DATA.personal.cashflow;
const cfNet = cf.monthIn - cf.monthOut;
$("#cashflowRow").innerHTML =
  `<div class="cfcard ${cfNet>=0?'cfgood':'cfbad'}">
     <div class="cflabel">This month's cash flow</div>
     <div class="cfnum">${cfNet>=0?'+':''}${money(cfNet)}</div>
     <div class="cfsub"><span class="in">+${money(cf.monthIn)} in</span> · <span class="out">${money(cf.monthOut)} out</span></div>
   </div>`;

/* Business — two groups */
function bizCard(g){
  const net = g.month.income - g.month.expenses;
  return `<div class="bizcard">
    <div class="bizname">${g.name}</div>
    <div class="biznet ${net>=0?'good':'bad'}">${net>=0?'+':''}${money(net)}</div>
    <div class="io"><span class="in">+${money(g.month.income)}</span> &nbsp;·&nbsp; <span class="out">${money(g.month.expenses)}</span></div>
    <div class="bizsub">this month</div>
  </div>`;
}
$("#bizRows").innerHTML = bizCard(DATA.business.easylaunch) + bizCard(DATA.business.azramar);

/* Recent transactions */
function recentRows(list){
  return list.map(t => {
    const pos = t.amount >= 0;
    const amt = (pos?"+":"") + money(t.amount);
    return `<li><span class="rleft"><span class="rdate">${t.date}</span>${t.account}<span class="rnote">${t.note||""}</span></span>
      <span class="ramt ${pos?"good":"bad"}">${amt}</span></li>`;
  }).join("");
}
$("#recentPersonalRows").innerHTML = recentRows(DATA.recentPersonal || []);

/* Tasks — auto-shrink font as the list grows */
const nTasks = DATA.tasks.length;
const taskSize = nTasks <= 6 ? 4.2 : nTasks <= 9 ? 3.3 : nTasks <= 13 ? 2.7 : 2.2;
document.documentElement.style.setProperty("--taskSize", taskSize + "vh");
$("#taskRows").innerHTML = DATA.tasks.map(t =>
  `<li class="${t.done?"done":""}"><span class="box">${t.done?"✓":""}</span>${t.text}</li>`).join("")
  || "<li>No tasks yet — tell Wanda!</li>";

/* Calendar */
const now = new Date();
$("#calTitle").textContent = now.toLocaleDateString("en-US",{month:"long",year:"numeric"});
const y=now.getFullYear(), m=now.getMonth();
const firstDow=new Date(y,m,1).getDay(), daysIn=new Date(y,m+1,0).getDate();
const evDays=new Set(DATA.events.map(e=>e.date));
let g=["S","M","T","W","T","F","S"].map(d=>`<div class="dow">${d}</div>`).join("");
for(let i=0;i<firstDow;i++) g+=`<div></div>`;
for(let d=1;d<=daysIn;d++){
  const iso=`${y}-${String(m+1).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
  const cls=["day",d===now.getDate()?"today":"",evDays.has(iso)?"hasEvent":""].join(" ");
  g+=`<div class="${cls}">${d}</div>`;
}
$("#calGrid").innerHTML=g;
$("#eventRows").innerHTML=DATA.events.map(e=>{
  const dt=new Date(e.date+"T00:00");
  const when=dt.toLocaleDateString("en-US",{weekday:"short",month:"short",day:"numeric"})+(e.time?" · "+e.time:"");
  return `<li><div class="when">${when}</div><div class="what">${e.title}</div></li>`;
}).join("") || "<li><div class='what'>No upcoming events</div></li>";

$("#upd").textContent = DATA.updated;

/* Wanda summary screen */
const hr = new Date().getHours();
$("#greet").textContent = hr<12 ? "Good morning" : hr<18 ? "Good afternoon" : "Good evening";
$("#wandaMsg").textContent = DATA.wandaMessage || "";
$("#goalRows").innerHTML = (DATA.goals||[]).map(g =>
  `<div class="goal"><div class="gemoji">${g.emoji}</div><div class="glabel">${g.label}</div><div class="gnote">${g.note}</div></div>`).join("");

/* Savings screen */

  `<div class="pcard"><div class="plabel">House Fund</div><div class="net good">${money(S.houseFund)}</div><div class="io">toward the down payment</div></div>`+
  `<div class="pcard"><div class="plabel">Robinhood</div><div class="net">${money(S.robinhood)}</div><div class="io">investments</div></div>`+
  `<div class="pcard"><div class="plabel">SoFi Savings</div><div class="net">${money(S.sofi)}</div><div class="io">emergency fund</div></div>`;
$("#savingsNote").innerHTML = "Every transfer is a brick in the house 🏡";

/* Clock + cycling */
function tick(){ const t=new Date().toLocaleTimeString("en-US",{hour:"numeric",minute:"2-digit"});
  document.querySelectorAll(".clock").forEach(c=>c.textContent=t); }
tick(); setInterval(tick,15000);

const screens=[$("#s0"),$("#s1"),$("#s2"),$("#sSave"),$("#s3"),$("#s4")], dots=document.querySelectorAll(".dots span");
let cur=0;
function show(i){ cur=(i+screens.length)%screens.length;
  screens.forEach((s,j)=>s.classList.toggle("active",j===cur));
  dots.forEach((d,j)=>d.classList.toggle("on",j===cur)); }
show(0);

/* Auto-cycle, pausable */
const CYCLE_MS = 18000, IDLE_MS = 10*60*1000;
let autoTimer=null, idleTimer=null;
function startAuto(){ if(autoTimer) return;
  autoTimer=setInterval(()=>show(cur+1), CYCLE_MS); }
function stopAuto(){ clearInterval(autoTimer); autoTimer=null; }
function userActed(goto){
  stopAuto();
  if(typeof goto==="number") show(goto);
  clearTimeout(idleTimer);
  idleTimer=setTimeout(startAuto, IDLE_MS);   /* resume cycling after 10 min idle */
}
startAuto();

/* Dot taps */
dots.forEach((d,i)=> d.addEventListener("click",()=>userActed(i)));

/* Tap left/right half of screen to go prev/next */
document.body.addEventListener("click", e=>{
  if(e.target.closest(".dots")) return;           /* dots handled above */
  const goNext = e.clientX > window.innerWidth/2;
  userActed(cur + (goNext?1:-1));
});

/* Swipe (touch) */
let x0=null;
document.body.addEventListener("touchstart", e=>{ x0=e.changedTouches[0].clientX; }, {passive:true});
document.body.addEventListener("touchend", e=>{
  if(x0===null) return;
  const dx=e.changedTouches[0].clientX - x0;
  if(Math.abs(dx)>50) userActed(cur + (dx<0?1:-1));   /* swipe left = next */
  x0=null;
}, {passive:true});
</script>
</body>
