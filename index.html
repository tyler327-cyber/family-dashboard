<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="refresh" content="300">
<title>Family Dashboard</title>
<script>
/* ==========================================================
   WANDA: EDIT ONLY THIS DATA BLOCK.
   Two money worlds: personal and easylaunch.
   Each has income & expenses for day / week / month.
   "net" is auto-calculated (income - expenses) — leave it out.
   Then commit + push. The TV refreshes itself within 5 min.
   Do not touch anything below END WANDA DATA.
   ========================================================== */
const DATA = {
  updated: "Sun Aug 9, 2026 · 4:14 PM",
 
  personal: {
    day:   { income: 0,      expenses: 136.20 },
    week:  { income: 2814.65, expenses: 136.20 },
    month: { income: 2814.65, expenses: 216.20 }
  },
 
  easylaunch: {
    day:   { income: 0,      expenses: 0 },
    week:  { income: 595.96, expenses: 80.00 },
    month: { income: 595.96, expenses: 80.00 }
  },
 
  personalBudget: {       // personal spending targets — drive the bars on the Personal screen
    day:   71.43,
    week:  500.00,
    month: 2000.00
  },
 
  // Last few transactions per world (newest first) — Wanda keeps ~5 each, fills the lower screen
  recentPersonal: [
    { date: "Aug 9", account: "Chase Sapphire 1234", amount: -84.20, note: "Groceries" },
    { date: "Aug 9", account: "Wells Fargo 5678",    amount: -52.00, note: "Gas" },
    { date: "Aug 6", account: "Boeing",              amount: 2814.65, note: "Paycheck" }
  ],
  recentEasy: [
    { date: "Aug 5", account: "Airbnb payout", amount: 595.96, note: "STR payout" },
    { date: "Aug 8", account: "Amex Biz 71004", amount: -80.00, note: "Cleaning" }
  ],
 
  tasks: [
    { text: "Example — pick up groceries", done: false },
    { text: "Example — pay Wells Fargo payment", done: false },
    { text: "Example — call about Midway cleaning", done: true }
  ],
 
  events: [
    { date: "2026-08-10", time: "9:00 AM", title: "Example — Dentist" },
    { date: "2026-08-12", time: "6:30 PM", title: "Example — Dinner with family" },
    { date: "2026-08-15", time: "",        title: "Example — Rent due" }
  ]
};
/* ================= END WANDA DATA ========================= */
</script>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { height:100%; background:#0d1117; color:#e6edf3;
    font-family:-apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    overflow:hidden; }
  .screen { position:absolute; inset:0; padding:4vh 5vw; opacity:0;
    transition:opacity 1.2s ease; pointer-events:none; display:flex; flex-direction:column; }
  .screen.active { opacity:1; pointer-events:auto; }
  header { display:flex; justify-content:space-between; align-items:baseline; margin-bottom:3vh; }
  h1 { font-size:4.2vh; letter-spacing:.06em; font-weight:600; text-transform:uppercase; }
  h1 .tag { color:#8b949e; }
  .clock { font-size:4.2vh; color:#8b949e; font-variant-numeric:tabular-nums; }
 
  .periods { display:grid; grid-template-columns:repeat(3,1fr); gap:2.5vh; margin-bottom:2.5vh; }
  .pcard { background:#161b22; border:1px solid #21262d; border-radius:18px; padding:2.6vh; text-align:center; }
  .pcard .plabel { font-size:2.2vh; color:#8b949e; text-transform:uppercase; letter-spacing:.08em; margin-bottom:.8vh; }
  .pcard .net { font-size:6vh; font-weight:700; font-variant-numeric:tabular-nums; line-height:1.05; }
  .pcard .io { font-size:2.3vh; color:#8b949e; margin-top:1vh; }
  .pcard .io .in { color:#3fb950; } .pcard .io .out { color:#f85149; }
  .good { color:#3fb950; } .bad { color:#f85149; } .warn { color:#d29922; }
 
  .budget { background:#161b22; border:1px solid #21262d; border-radius:18px; padding:2.8vh; margin-top:auto; }
  .budget .blabel { font-size:2.2vh; color:#8b949e; text-transform:uppercase; letter-spacing:.08em; }
  .budget .bnum { font-size:4vh; font-weight:700; font-variant-numeric:tabular-nums; margin-top:.6vh; }
  .bar { height:2.6vh; background:#21262d; border-radius:99px; overflow:hidden; margin-top:1.4vh; }
  .bar > div { height:100%; border-radius:99px; }
 
  .recent { margin-top:2.5vh; background:#161b22; border:1px solid #21262d; border-radius:18px; padding:2.4vh 2.8vh; flex:1; min-height:0; overflow:hidden; }
  .recent .rlabel { font-size:2.2vh; color:#8b949e; text-transform:uppercase; letter-spacing:.08em; margin-bottom:1.4vh; }
  .recent ul { list-style:none; }
  .recent li { display:flex; justify-content:space-between; align-items:baseline; font-size:2.7vh; padding:1.1vh 0; border-bottom:1px solid #1c2128; }
  .recent li:last-child { border-bottom:none; }
  .recent .rleft { color:#e6edf3; }
  .recent .rleft .rdate { color:#8b949e; font-size:2.1vh; margin-right:1vw; }
  .recent .rnote { color:#8b949e; font-size:2.1vh; margin-left:1vw; }
  .recent .ramt { font-variant-numeric:tabular-nums; font-weight:600; }
 
  .tasklist { font-size:var(--taskSize, 4.2vh); line-height:1.9; }
  .tasklist li { list-style:none; display:flex; align-items:center; gap:1.5vw; }
  .box { width:3.6vh; height:3.6vh; border:.35vh solid #30363d; border-radius:.9vh; flex:0 0 auto;
    display:flex; align-items:center; justify-content:center; font-size:2.6vh; }
  .done { color:#484f58; text-decoration:line-through; }
  .done .box { border-color:#238636; color:#3fb950; }
 
  .cal { display:grid; grid-template-columns:1.15fr .85fr; gap:3vw; flex:1; min-height:0; }
  .grid { display:grid; grid-template-columns:repeat(7,1fr); gap:.6vh; align-content:start; }
  .grid .dow { font-size:1.9vh; color:#8b949e; text-align:center; text-transform:uppercase; padding:.6vh 0; }
  .grid .day { aspect-ratio:1.5; background:#161b22; border:1px solid #21262d; border-radius:10px;
    font-size:2.4vh; padding:.7vh; color:#8b949e; }
  .grid .day.today { background:#1f6feb; color:#fff; font-weight:700; }
  .grid .day.hasEvent { border-color:#d29922; color:#e6edf3; }
  .events li { list-style:none; background:#161b22; border:1px solid #21262d; border-radius:14px;
    padding:2vh; margin-bottom:1.6vh; }
  .events .when { font-size:2.1vh; color:#d29922; text-transform:uppercase; letter-spacing:.06em; }
  .events .what { font-size:3.2vh; margin-top:.4vh; }
 
  .dots { position:absolute; bottom:2.5vh; left:0; right:0; display:flex; justify-content:center; gap:1.4vh; z-index:10; }
  .dots span { width:1.4vh; height:1.4vh; border-radius:50%; background:#30363d; transition:background .4s;
    cursor:pointer; padding:1.2vh; background-clip:content-box; }
  .dots span.on { background:#e6edf3; background-clip:content-box; }
  .updated { position:absolute; bottom:2.3vh; right:3vw; font-size:1.8vh; color:#484f58; }
</style>
</head>
<body>
 
<!-- SCREEN 1: PERSONAL -->
<section class="screen" id="s0">
  <header><h1>Personal <span class="tag">· Money</span></h1><div class="clock"></div></header>
  <div class="periods" id="pPersonal"></div>
  <div class="recent"><div class="rlabel">Recent</div><ul id="recentPersonalRows"></ul></div>
</section>
 
<!-- SCREEN 2: EASY LAUNCH -->
<section class="screen" id="s1">
  <header><h1>Easy Launch <span class="tag">· Services</span></h1><div class="clock"></div></header>
  <div class="periods" id="pEasy"></div>
  <div class="budget">
    <div class="blabel">Month net · business</div>
    <div class="bnum" id="easyNet"></div>
  </div>
  <div class="recent"><div class="rlabel">Recent</div><ul id="recentEasyRows"></ul></div>
</section>
 
<!-- SCREEN 3: TASKS -->
<section class="screen" id="s2">
  <header><h1>Today's Tasks</h1><div class="clock"></div></header>
  <ul class="tasklist" id="taskRows"></ul>
</section>
 
<!-- SCREEN 4: CALENDAR -->
<section class="screen" id="s3">
  <header><h1 id="calTitle">Calendar</h1><div class="clock"></div></header>
  <div class="cal">
    <div><div class="grid" id="calGrid"></div></div>
    <div><ul class="events" id="eventRows"></ul></div>
  </div>
</section>
 
<div class="dots"><span></span><span></span><span></span><span></span></div>
<div class="updated">Updated <span id="upd"></span></div>
 
<script>
const $ = s => document.querySelector(s);
const money = n => (n<0?"-$":"$") + Math.abs(n).toLocaleString("en-US",{maximumFractionDigits:0});
 
function periodCards(world, budgets){
  return ["day","week","month"].map(p => {
    const d = world[p], net = d.income - d.expenses;
    const label = p==="day"?"Today":p==="week"?"This Week":"This Month";
    let barHtml = "";
    if (budgets){
      const b = budgets[p], pct = Math.min(100, d.expenses/b*100);
      const col = pct<70?"#3fb950":pct<100?"#d29922":"#f85149";
      barHtml = `<div class="io" style="margin-top:1.4vh">${money(d.expenses)} of ${money(b)} budget</div>
        <div class="bar" style="margin-top:.8vh"><div style="width:${pct}%;background:${col}"></div></div>`;
    }
    return `<div class="pcard">
      <div class="plabel">${label}</div>
      <div class="net ${net>=0?"good":"bad"}">${money(net)}</div>
      <div class="io"><span class="in">+${money(d.income)}</span> &nbsp;·&nbsp; <span class="out">${money(d.expenses)}</span></div>
      ${barHtml}
    </div>`;
  }).join("");
}
 
$("#pPersonal").innerHTML = periodCards(DATA.personal, DATA.personalBudget);
$("#pEasy").innerHTML = periodCards(DATA.easylaunch, null);
 
/* Easy Launch month net */
const eNet = DATA.easylaunch.month.income - DATA.easylaunch.month.expenses;
$("#easyNet").textContent = money(eNet);
$("#easyNet").className = "bnum " + (eNet>=0?"good":"bad");
 
/* Recent transactions */
function recentRows(list){
  return list.map(t => {
    const pos = t.amount >= 0;
    const amt = (pos?"+":"") + money(t.amount);
    return `<li><span class="rleft"><span class="rdate">${t.date}</span>${t.account}<span class="rnote">${t.note||""}</span></span>
      <span class="ramt ${pos?"good":"bad"}">${amt}</span></li>`;
  }).join("");
}
$("#recentPersonalRows").innerHTML = recentRows(DATA.recentPersonal || []);
$("#recentEasyRows").innerHTML = recentRows(DATA.recentEasy || []);
 
/* Tasks — auto-shrink font as the list grows */
const nTasks = DATA.tasks.length;
const taskSize = nTasks <= 6 ? 4.2 : nTasks <= 9 ? 3.3 : nTasks <= 13 ? 2.7 : 2.2;
document.documentElement.style.setProperty("--taskSize", taskSize + "vh");
$("#taskRows").innerHTML = DATA.tasks.map(t =>
  `<li class="${t.done?"done":""}"><span class="box">${t.done?"✓":""}</span>${t.text}</li>`).join("")
  || "<li>No tasks yet — tell Wanda!</li>";
 
/* Calendar */
const now = new Date();
$("#calTitle").textContent = now.toLocaleDateString("en-US",{month:"long",year:"numeric"});
const y=now.getFullYear(), m=now.getMonth();
const firstDow=new Date(y,m,1).getDay(), daysIn=new Date(y,m+1,0).getDate();
const evDays=new Set(DATA.events.map(e=>e.date));
let g=["S","M","T","W","T","F","S"].map(d=>`<div class="dow">${d}</div>`).join("");
for(let i=0;i<firstDow;i++) g+=`<div></div>`;
for(let d=1;d<=daysIn;d++){
  const iso=`${y}-${String(m+1).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
  const cls=["day",d===now.getDate()?"today":"",evDays.has(iso)?"hasEvent":""].join(" ");
  g+=`<div class="${cls}">${d}</div>`;
}
$("#calGrid").innerHTML=g;
$("#eventRows").innerHTML=DATA.events.map(e=>{
  const dt=new Date(e.date+"T00:00");
  const when=dt.toLocaleDateString("en-US",{weekday:"short",month:"short",day:"numeric"})+(e.time?" · "+e.time:"");
  return `<li><div class="when">${when}</div><div class="what">${e.title}</div></li>`;
}).join("") || "<li><div class='what'>No upcoming events</div></li>";
 
$("#upd").textContent = DATA.updated;
 
/* Clock + cycling */
function tick(){ const t=new Date().toLocaleTimeString("en-US",{hour:"numeric",minute:"2-digit"});
  document.querySelectorAll(".clock").forEach(c=>c.textContent=t); }
tick(); setInterval(tick,15000);
 
const screens=[$("#s0"),$("#s1"),$("#s2"),$("#s3")], dots=document.querySelectorAll(".dots span");
let cur=0;
function show(i){ cur=(i+screens.length)%screens.length;
  screens.forEach((s,j)=>s.classList.toggle("active",j===cur));
  dots.forEach((d,j)=>d.classList.toggle("on",j===cur)); }
show(0);
 
/* Auto-cycle, pausable */
const CYCLE_MS = 18000, IDLE_MS = 10*60*1000;
let autoTimer=null, idleTimer=null;
function startAuto(){ if(autoTimer) return;
  autoTimer=setInterval(()=>show(cur+1), CYCLE_MS); }
function stopAuto(){ clearInterval(autoTimer); autoTimer=null; }
function userActed(goto){
  stopAuto();
  if(typeof goto==="number") show(goto);
  clearTimeout(idleTimer);
  idleTimer=setTimeout(startAuto, IDLE_MS);   /* resume cycling after 10 min idle */
}
startAuto();
 
/* Dot taps */
dots.forEach((d,i)=> d.addEventListener("click",()=>userActed(i)));
 
/* Tap left/right half of screen to go prev/next */
document.body.addEventListener("click", e=>{
  if(e.target.closest(".dots")) return;           /* dots handled above */
  const goNext = e.clientX > window.innerWidth/2;
  userActed(cur + (goNext?1:-1));
});
 
/* Swipe (touch) */
let x0=null;
document.body.addEventListener("touchstart", e=>{ x0=e.changedTouches[0].clientX; }, {passive:true});
document.body.addEventListener("touchend", e=>{
  if(x0===null) return;
  const dx=e.changedTouches[0].clientX - x0;
  if(Math.abs(dx)>50) userActed(cur + (dx<0?1:-1));   /* swipe left = next */
  x0=null;
}, {passive:true});
</script>
</body>
</html>
